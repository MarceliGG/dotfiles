theme = "custom-simple"

[keys.normal]
"C-s" = ":write"
"x" = ["goto_line_start", "select_mode", "goto_line_end_newline"]
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"

[keys.insert]
"C-s" = ":write"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
"C-s" = ":write"

[keys.normal.space]
"space" = ":format"
"q" = ":buffer-close"
"\\" = ":config-reload"

[keys.select.space]
"space" = ":format"
"q" = ":buffer-close"

[editor.statusline]
left = ["mode", "file-name", "file-modification-indicator", "read-only-indicator", "spinner"]
right = ["diagnostics", "selections", "position"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.whitespace.render]
tab = "all"

[editor.indent-guides]
render = true
skip-levels = 1

[editor.cursor-shape]
insert = "bar"

[editor.soft-wrap]
enable = true
wrap-indicator = ""

[editor.lsp]
display-messages = true

[editor]
color-modes = true
end-of-line-diagnostics = "hint"
gutters = ["line-numbers", "diagnostics"]
cursorline = true
 
[editor.inline-diagnostics]
cursor-line = "hint"
max-diagnostics = 3
