set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-rename on

set -g status-interval 3
set -g automatic-rename on
set -g automatic-rename-format '#{pane_title}'

set -g status-style 'bg=colour235,fg=white'
set -g window-status-current-style "fg=colour235,bg=yellow,bold"
set -g window-active-style 'bg=#{?#{>:#{window_panes},1},color233,default}'
set -g pane-active-border-style "fg=yellow,bg=color233"

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

bind '\' source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded config"
bind C-c new-window
bind C-w choose-tree -Zs
bind s split-pane -v
bind v split-pane -h

bind -n C-n next-window
bind -n C-p previous-window

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

